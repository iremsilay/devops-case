
name: CI - MERN and ETL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Backend validation
  backend:
    name: Backend validation
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: mern-project/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mern-project/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check JavaScript syntax
        run: |
          node --check server.mjs
          node --check loadEnvironment.mjs
          node --check db/conn.mjs
          node --check routes/record.mjs
          node --check routes/healthcheck.mjs

  # 2. Frontend validation
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: mern-project/client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mern-project/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        env:
          CI: "true"
          REACT_APP_API_BASE_URL: /api
        run: npm run build

  # 3. Python ETL validation
  etl:
    name: Python ETL validation
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: python-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-project/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile ETL.py

      - name: Verify Python imports
        run: |
          python -c "import requests"
          python -c "import pymongo"

  # 4. Cypress end-to-end tests
  cypress:
    name: Cypress E2E
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mern-project/client/package-lock.json

      - name: Create Docker network
        run: docker network create case-ci

      - name: Start MongoDB
        run: |
          docker run -d \
            --name case-ci-mongodb \
            --network case-ci \
            --network-alias mongodb \
            mongo:7

      - name: Build backend image
        run: |
          docker build \
            -t case-ci-backend \
            ./mern-project/server

      - name: Start backend
        run: |
          docker run -d \
            --name case-ci-backend \
            --network case-ci \
            --network-alias case-backend \
            -p 127.0.0.1:5050:5050 \
            -e ATLAS_URI=mongodb://mongodb:27017 \
            -e NODE_ENV=production \
            case-ci-backend

      - name: Wait for backend readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS \
              http://localhost:5050/healthcheck/ready; then
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not become ready."
          exit 1

      - name: Build frontend image
        run: |
          docker build \
            -t case-ci-frontend \
            ./mern-project/client

      - name: Start frontend
        run: |
          docker run -d \
            --name case-ci-frontend \
            --network case-ci \
            -p 127.0.0.1:8082:8080 \
            case-ci-frontend

      - name: Wait for frontend and API
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8082/ \
              > /dev/null && \
               curl -fsS \
              http://localhost:8082/api/healthcheck/ready \
              > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Frontend or API did not become ready."
          exit 1

      - name: Install Cypress dependencies
        working-directory: mern-project/client
        run: npm ci

      - name: Run Cypress tests
        working-directory: mern-project/client
        run: |
          npx cypress run \
            --browser chrome \
            --headless \
            --config baseUrl=http://localhost:8082

      - name: Print container logs on failure
        if: failure()
        run: |
          docker logs case-ci-mongodb || true
          docker logs case-ci-backend || true
          docker logs case-ci-frontend || true

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-screenshots
          path: mern-project/client/cypress/screenshots/
          if-no-files-found: ignore

  # 5. Docker build and GHCR publishing
  docker:
    name: Docker - ${{ matrix.component }}

    needs:
      - backend
      - frontend
      - etl
      - cypress

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - component: backend
            context: ./mern-project/server

          - component: frontend
            context: ./mern-project/client

          - component: etl
            context: ./python-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}-${COMPONENT}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
