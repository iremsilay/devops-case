
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-reader
  namespace: devops-case
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]

  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]

  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["monitoring-state"]
    verbs: ["get", "patch"]
